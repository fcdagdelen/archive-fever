<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Topology — Epistemological Paths</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0a0a12 0%, #1a1a2e 100%);
            color: #e8e8f0;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 300;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: #8888a0;
            font-size: 0.95rem;
        }

        .canvas-container {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        svg {
            width: 100%;
            height: 100%;
            max-width: 1200px;
            max-height: 700px;
        }

        .path-line {
            fill: none;
            stroke-width: 3;
            stroke-linecap: round;
        }

        .path-traditional {
            stroke: #6366f1;
        }

        .path-vibe {
            stroke: #22c55e;
        }

        .path-hybrid {
            stroke: #f59e0b;
            stroke-dasharray: 8 4;
        }

        .node {
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .node:hover {
            transform: scale(1.1);
        }

        .node circle {
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.2));
        }

        .node text {
            fill: #e8e8f0;
            font-size: 11px;
            font-weight: 500;
        }

        .axis-label {
            fill: #555566;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .legend {
            position: absolute;
            bottom: 2rem;
            left: 2rem;
            background: rgba(26, 26, 38, 0.9);
            border: 1px solid #2a2a3a;
            border-radius: 12px;
            padding: 1rem 1.5rem;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
        }

        .legend-item:last-child {
            margin-bottom: 0;
        }

        .legend-line {
            width: 24px;
            height: 3px;
            border-radius: 2px;
        }

        .info-panel {
            position: absolute;
            top: 2rem;
            right: 2rem;
            background: rgba(26, 26, 38, 0.95);
            border: 1px solid #2a2a3a;
            border-radius: 12px;
            padding: 1.5rem;
            max-width: 320px;
            display: none;
        }

        .info-panel.active {
            display: block;
        }

        .info-panel h3 {
            font-size: 1rem;
            margin-bottom: 0.75rem;
            color: #6366f1;
        }

        .info-panel p {
            font-size: 0.9rem;
            color: #8888a0;
            line-height: 1.6;
        }

        .info-panel .close {
            position: absolute;
            top: 0.75rem;
            right: 0.75rem;
            background: none;
            border: none;
            color: #555566;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .quote {
            margin-top: 1rem;
            padding: 0.75rem;
            background: rgba(99, 102, 241, 0.1);
            border-left: 3px solid #6366f1;
            font-style: italic;
            font-size: 0.85rem;
            color: #b8b8c8;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Learning Topology</h1>
            <p class="subtitle">How different epistemological paths produce different knowledge shapes</p>
        </header>

        <div class="canvas-container">
            <svg viewBox="0 0 1000 600" id="canvas">
                <!-- Axes -->
                <line x1="100" y1="550" x2="900" y2="550" stroke="#2a2a3a" stroke-width="1"/>
                <line x1="100" y1="550" x2="100" y2="50" stroke="#2a2a3a" stroke-width="1"/>
                
                <!-- Axis labels -->
                <text x="500" y="590" class="axis-label" text-anchor="middle">Time / Iterations</text>
                <text x="40" y="300" class="axis-label" text-anchor="middle" transform="rotate(-90, 40, 300)">Knowledge Coverage</text>

                <!-- Grid lines -->
                <g stroke="#1a1a2e" stroke-width="1">
                    <line x1="100" y1="450" x2="900" y2="450" stroke-dasharray="4 4"/>
                    <line x1="100" y1="350" x2="900" y2="350" stroke-dasharray="4 4"/>
                    <line x1="100" y1="250" x2="900" y2="250" stroke-dasharray="4 4"/>
                    <line x1="100" y1="150" x2="900" y2="150" stroke-dasharray="4 4"/>
                    <line x1="300" y1="550" x2="300" y2="50" stroke-dasharray="4 4"/>
                    <line x1="500" y1="550" x2="500" y2="50" stroke-dasharray="4 4"/>
                    <line x1="700" y1="550" x2="700" y2="50" stroke-dasharray="4 4"/>
                </g>

                <!-- Traditional path: slow, deep, linear -->
                <path class="path-line path-traditional" d="
                    M 100,520
                    C 200,510 250,480 300,440
                    C 350,400 400,350 450,310
                    C 500,270 550,230 600,200
                    C 650,170 700,150 750,140
                    C 800,130 850,125 900,120
                "/>

                <!-- Vibe coding path: fast initial breadth, then deepening -->
                <path class="path-line path-vibe" d="
                    M 100,520
                    C 150,400 180,300 220,220
                    C 260,140 300,100 350,90
                    C 400,80 450,85 500,95
                    C 550,105 600,120 650,130
                    C 700,140 750,145 800,148
                    C 850,151 880,153 900,155
                "/>

                <!-- Hybrid path: starts vibe, integrates traditional -->
                <path class="path-line path-hybrid" d="
                    M 100,520
                    C 150,420 180,340 230,280
                    C 280,220 320,180 380,160
                    C 440,140 500,130 560,115
                    C 620,100 680,90 740,85
                    C 800,80 850,78 900,75
                "/>

                <!-- Nodes: Traditional path -->
                <g class="node" data-id="trad-1">
                    <circle cx="100" cy="520" r="8" fill="#6366f1"/>
                    <text x="100" y="545" text-anchor="middle">Start</text>
                </g>
                <g class="node" data-id="trad-2">
                    <circle cx="300" cy="440" r="8" fill="#6366f1"/>
                    <text x="300" y="465" text-anchor="middle">Fundamentals</text>
                </g>
                <g class="node" data-id="trad-3">
                    <circle cx="500" cy="290" r="8" fill="#6366f1"/>
                    <text x="500" y="315" text-anchor="middle">Deep Practice</text>
                </g>
                <g class="node" data-id="trad-4">
                    <circle cx="700" cy="150" r="8" fill="#6366f1"/>
                    <text x="700" y="175" text-anchor="middle">Mastery</text>
                </g>
                <g class="node" data-id="trad-5">
                    <circle cx="900" cy="120" r="8" fill="#6366f1"/>
                    <text x="900" y="105" text-anchor="middle">Expertise</text>
                </g>

                <!-- Nodes: Vibe coding path -->
                <g class="node" data-id="vibe-1">
                    <circle cx="220" cy="220" r="8" fill="#22c55e"/>
                    <text x="220" y="205" text-anchor="middle">Fast Breadth</text>
                </g>
                <g class="node" data-id="vibe-2">
                    <circle cx="350" cy="90" r="8" fill="#22c55e"/>
                    <text x="350" y="75" text-anchor="middle">Pattern Recognition</text>
                </g>
                <g class="node" data-id="vibe-3">
                    <circle cx="550" cy="100" r="8" fill="#22c55e"/>
                    <text x="550" y="125" text-anchor="middle">Navigability</text>
                </g>
                <g class="node" data-id="vibe-4">
                    <circle cx="900" cy="155" r="8" fill="#22c55e"/>
                    <text x="860" y="175" text-anchor="end">Tool-Augmented</text>
                </g>

                <!-- Nodes: Hybrid path -->
                <g class="node" data-id="hybrid-1">
                    <circle cx="380" cy="160" r="8" fill="#f59e0b"/>
                    <text x="380" y="145" text-anchor="middle">Synthesis</text>
                </g>
                <g class="node" data-id="hybrid-2">
                    <circle cx="740" cy="85" r="8" fill="#f59e0b"/>
                    <text x="740" y="70" text-anchor="middle">Integration</text>
                </g>
                <g class="node" data-id="hybrid-3">
                    <circle cx="900" cy="75" r="8" fill="#f59e0b"/>
                    <text x="860" y="60" text-anchor="end">Full Capability</text>
                </g>

                <!-- Zone labels -->
                <text x="200" y="500" fill="#3a3a4a" font-size="10" font-style="italic">Slow accumulation</text>
                <text x="200" y="180" fill="#3a3a4a" font-size="10" font-style="italic">Rapid exploration</text>
                <text x="800" y="100" fill="#3a3a4a" font-size="10" font-style="italic">Convergence zone</text>
            </svg>

            <div class="legend">
                <div class="legend-item">
                    <div class="legend-line" style="background: #6366f1;"></div>
                    <span>Traditional (depth-first)</span>
                </div>
                <div class="legend-item">
                    <div class="legend-line" style="background: #22c55e;"></div>
                    <span>Vibe Coding (breadth-first)</span>
                </div>
                <div class="legend-item">
                    <div class="legend-line" style="background: #f59e0b; background-image: repeating-linear-gradient(90deg, #f59e0b 0 8px, transparent 8px 12px);"></div>
                    <span>Hybrid (adaptive)</span>
                </div>
            </div>

            <div class="info-panel" id="info-panel">
                <button class="close" onclick="closePanel()">×</button>
                <h3 id="panel-title"></h3>
                <p id="panel-text"></p>
                <div class="quote" id="panel-quote"></div>
            </div>
        </div>
    </div>

    <script>
        const nodeInfo = {
            'trad-1': {
                title: 'Start: Beginner Mind',
                text: 'Traditional learning begins with foundational concepts, vocabulary, and mental models. Progress is slow but builds solid ground.',
                quote: 'You have to learn the rules before you can break them.'
            },
            'trad-2': {
                title: 'Fundamentals',
                text: 'Deep understanding of core principles. Memorization, practice exercises, building muscle memory. This phase takes months or years.',
                quote: 'The jazz player internalizes hundreds of songs before improvising.'
            },
            'trad-3': {
                title: 'Deep Practice',
                text: 'Deliberate practice in a narrow domain. Expertise emerges from thousands of repetitions. Knowledge becomes tacit and intuitive.',
                quote: 'To get better at writing, you need to write.'
            },
            'trad-4': {
                title: 'Mastery',
                text: 'Fluency without conscious effort. Can debug novel problems without tools. Knowledge is portable and tool-independent.',
                quote: 'Reproducibility without tools.'
            },
            'trad-5': {
                title: 'Expertise',
                text: 'Teaching others, creating new knowledge, pushing boundaries of the field. Deep expertise in a focused area.',
                quote: 'The master has failed more times than the beginner has tried.'
            },
            'vibe-1': {
                title: 'Fast Breadth',
                text: 'Vibe coding compresses the feedback loop. Build 10 things across 5 frameworks instead of mastering one. See patterns across the landscape.',
                quote: 'I know much more about software since I started vibe coding.'
            },
            'vibe-2': {
                title: 'Pattern Recognition',
                text: 'Instead of deep knowledge of any single tool, develop intuition for which tools solve which shapes of problems. Meta-knowledge.',
                quote: 'Navigability with tools, not reproducibility without them.'
            },
            'vibe-3': {
                title: 'Navigability',
                text: 'Can traverse the problem space efficiently. Knows what questions to ask, what to search for, how to evaluate solutions.',
                quote: 'Different epistemics, not worse epistemics.'
            },
            'vibe-4': {
                title: 'Tool-Augmented Capability',
                text: 'High effectiveness when working with AI tools. May depend on tools for certain operations but covers more ground than traditional alone.',
                quote: 'The question is which loops you need to stay in.'
            },
            'hybrid-1': {
                title: 'Synthesis Point',
                text: 'After rapid exploration, recognize which areas need deeper investment. Use vibe coding to survey, then go deep where it matters.',
                quote: 'Breadth to find, depth to understand.'
            },
            'hybrid-2': {
                title: 'Integration',
                text: 'Combining tool-augmented speed with selected deep expertise. Know when to rely on AI and when to do it yourself.',
                quote: 'Some mental tasks are important to do, even if machines could.'
            },
            'hybrid-3': {
                title: 'Full Capability',
                text: 'Maximum coverage: breadth from exploration, depth in critical areas, tool-augmentation where appropriate. Adaptive epistemics.',
                quote: 'Alien epistemics that traditional paths wouldn\'t allow.'
            }
        };

        document.querySelectorAll('.node').forEach(node => {
            node.addEventListener('click', () => {
                const id = node.dataset.id;
                const info = nodeInfo[id];
                if (info) {
                    document.getElementById('panel-title').textContent = info.title;
                    document.getElementById('panel-text').textContent = info.text;
                    document.getElementById('panel-quote').textContent = info.quote;
                    document.getElementById('info-panel').classList.add('active');
                }
            });
        });

        function closePanel() {
            document.getElementById('info-panel').classList.remove('active');
        }

        // Close on escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closePanel();
        });
    </script>
</body>
</html>
