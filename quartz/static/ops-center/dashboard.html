<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ops Center — Alter + Cem</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #1a1a24;
            --border: #2a2a3a;
            --text-primary: #e8e8f0;
            --text-secondary: #8888a0;
            --text-muted: #555566;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.3);
            --success: #22c55e;
            --warning: #eab308;
            --info: #3b82f6;
            --dormant: #64748b;
        }

        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .logo h1 {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .logo span {
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 400;
        }

        .timestamp {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 1.5rem;
        }

        @media (max-width: 900px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
        }

        .project-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.25rem;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .project-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .project-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.75rem;
        }

        .project-name {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .status-badge {
            font-size: 0.75rem;
            padding: 0.25rem 0.5rem;
            border-radius: 6px;
            font-weight: 500;
        }

        .status-active {
            background: rgba(34, 197, 94, 0.15);
            color: var(--success);
        }

        .status-waiting {
            background: rgba(234, 179, 8, 0.15);
            color: var(--warning);
        }

        .status-scheduled {
            background: rgba(59, 130, 246, 0.15);
            color: var(--info);
        }

        .status-dormant {
            background: rgba(100, 116, 139, 0.15);
            color: var(--dormant);
        }

        .project-oneliner {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 0.75rem;
            line-height: 1.5;
        }

        .project-threads {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .thread-count {
            color: var(--accent);
            font-weight: 600;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .blocked-item {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 0.75rem;
        }

        .blocked-item:last-child {
            margin-bottom: 0;
        }

        .blocked-project {
            font-size: 0.75rem;
            color: #ef4444;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.25rem;
        }

        .blocked-text {
            font-size: 0.9rem;
            color: var(--text-primary);
        }

        .activity-item {
            display: flex;
            gap: 1rem;
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--border);
        }

        .activity-item:last-child {
            border-bottom: none;
        }

        .activity-date {
            font-size: 0.75rem;
            color: var(--text-muted);
            white-space: nowrap;
            width: 60px;
            flex-shrink: 0;
        }

        .activity-content {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .activity-project {
            color: var(--accent);
            font-weight: 500;
        }

        .quick-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        @media (max-width: 600px) {
            .quick-stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .stat-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem;
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .decision-item {
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--border);
        }

        .decision-item:last-child {
            border-bottom: none;
        }

        .decision-date {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .decision-text {
            font-size: 0.9rem;
            color: var(--text-primary);
            margin: 0.25rem 0;
        }

        .decision-context {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .empty-state {
            color: var(--text-muted);
            font-style: italic;
            font-size: 0.9rem;
            padding: 1rem 0;
        }

        /* Detail modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            max-width: 600px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            padding: 2rem;
        }

        .modal-close {
            float: right;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.5rem;
            line-height: 1;
        }

        .modal-close:hover {
            color: var(--text-primary);
        }

        .modal h2 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .modal-oneliner {
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
            font-size: 1rem;
        }

        .modal-section {
            margin-bottom: 1.5rem;
        }

        .modal-section h3 {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.75rem;
        }

        .modal-section p, .modal-section li {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .modal-section ul {
            list-style: none;
            padding: 0;
        }

        .modal-section li {
            padding: 0.25rem 0;
        }

        .modal-section li::before {
            content: "→ ";
            color: var(--accent);
        }

        .thread-done {
            text-decoration: line-through;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <div class="logo-icon">✨</div>
                <div>
                    <h1>Ops Center</h1>
                    <span>Alter + Cem</span>
                </div>
            </div>
            <div class="timestamp" id="timestamp"></div>
        </header>

        <div class="quick-stats">
            <div class="stat-card">
                <div class="stat-value" id="stat-active">4</div>
                <div class="stat-label">Active</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="stat-waiting">1</div>
                <div class="stat-label">Waiting</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="stat-threads">8</div>
                <div class="stat-label">Threads</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="stat-blocked">2</div>
                <div class="stat-label">Blocked</div>
            </div>
        </div>

        <div class="grid">
            <div class="main">
                <div class="card">
                    <div class="card-header">
                        <div class="card-title">Projects</div>
                    </div>
                    <div class="project-grid" id="project-grid">
                        <!-- Projects populated by JS -->
                    </div>
                </div>
            </div>

            <div class="sidebar">
                <div class="card">
                    <div class="card-header">
                        <div class="card-title">🚫 Blocked</div>
                    </div>
                    <div id="blocked-list">
                        <!-- Blocked items populated by JS -->
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <div class="card-title">Recent Decisions</div>
                    </div>
                    <div id="decisions-list">
                        <!-- Decisions populated by JS -->
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <div class="card-title">Activity</div>
                    </div>
                    <div id="activity-list">
                        <!-- Activity populated by JS -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modal-overlay">
        <div class="modal" id="modal">
            <button class="modal-close" onclick="closeModal()">×</button>
            <div id="modal-content"></div>
        </div>
    </div>

    <script>
        // Project data - update this when projects change
        const projects = [
            {
                id: 'giza',
                name: 'GIZA',
                status: 'active',
                oneliner: 'Agentic DeFi platform — AI agents as cognitive extensions for automated finance.',
                threads: [
                    { text: 'Tokenomics work + points paper iteration', done: false },
                    { text: 'Publication timeline management', done: false },
                    { text: 'Internal manifesto development', done: false }
                ],
                currentState: 'Phase 2 development. Core concept: "Financial exocognition."',
                blocked: null,
                links: { repo: '(private)' },
                context: 'GIZA and Caravanserai are SEPARATE projects. "Financial exocognition" is the core framing.'
            },
            {
                id: 'lace',
                name: 'LACE',
                status: 'active',
                oneliner: 'AI-powered knowledge management using Neo4j graphs with emergent ontology.',
                threads: [
                    { text: 'Fragment-based architecture migration', done: false },
                    { text: 'Meta-project detection via shared fragments', done: false }
                ],
                currentState: 'Evolving from monolithic to fragment-based associations.',
                blocked: null,
                links: { repo: 'github.com/fcdagdelen/LACE' },
                context: 'Core philosophy: emergent ontology — don\'t impose structure, let it crystallize from observation.'
            },
            {
                id: 'tristero',
                name: 'Tristero',
                status: 'active',
                oneliner: 'Adaptive knowledge graph with event sourcing and governed reflection.',
                threads: [
                    { text: 'V2 architecture work', done: false }
                ],
                currentState: 'V2 architecture in progress.',
                blocked: null,
                links: { repo: 'github.com/fcdagdelen/tristero' },
                context: 'Event sourcing = append-only log of facts. "Governed reflection" = self-modification within constraints.'
            },
            {
                id: 'archive-fever',
                name: 'Archive Fever',
                status: 'active',
                oneliner: 'Research essays exploring threshold structures, memory, emergence, and transformation.',
                threads: [
                    { text: 'Knowledge Constellation visualization', done: true },
                    { text: 'Potential v2 features', done: false }
                ],
                currentState: '22 essays published. Constellation live.',
                blocked: null,
                links: { 
                    site: 'fcdagdelen.github.io/archive-fever/',
                    constellation: 'fcdagdelen.github.io/archive-fever/static/constellation/'
                },
                context: 'Core themes: threshold structures, emergent ontology, transformation without destruction.'
            },
            {
                id: 'pci',
                name: 'PCI',
                status: 'waiting',
                oneliner: 'Computational psychology modeling through reasoning traces.',
                threads: [
                    { text: 'Conceptual framework development', done: false }
                ],
                currentState: 'Conceptual development phase.',
                blocked: 'Needs dedicated focus time',
                links: { repo: 'github.com/fcdagdelen/psyche1' },
                context: '⚠️ NO psychoanalytic frameworks. Use: mechanism design, epistemology, finance, architecture.'
            },
            {
                id: 'alter',
                name: 'Alter',
                status: 'active',
                oneliner: 'Personal AI assistant — building a persistent, capable collaborator.',
                threads: [
                    { text: 'Bootstrap identity', done: true },
                    { text: 'Archive Fever constellation', done: true },
                    { text: 'Voice transcription', done: false },
                    { text: 'Calendar integration', done: false },
                    { text: 'Ops Center', done: false }
                ],
                currentState: 'Running on OpenClaw. Connected via Telegram.',
                blocked: 'Voice: needs OPENAI_API_KEY. Calendar: needs setup.',
                links: { docs: 'docs.openclaw.ai' },
                context: 'Key files: SOUL.md, AGENTS.md, MEMORY.md, USER.md'
            },
            {
                id: 'exopolis',
                name: 'Exopolis',
                status: 'dormant',
                oneliner: 'Journaling app that generates a city visualization from journal entries.',
                threads: [],
                currentState: 'Dormant. Conceptually connected to PCI.',
                blocked: null,
                links: { repo: 'github.com/fcdagdelen/exopolis' },
                context: 'Journal entries → urban morphology. Externalized psyche.'
            },
            {
                id: 'nfold',
                name: 'nfold',
                status: 'dormant',
                oneliner: 'Financial exocortex — personal financial intelligence system.',
                threads: [],
                currentState: 'Dormant.',
                blocked: null,
                links: { repo: 'github.com/fcdagdelen/nfold' },
                context: 'May be personal tool vs. GIZA which is product for others.'
            }
        ];

        const recentDecisions = [
            {
                date: '2026-02-01',
                text: 'Build Ops Center for context continuity',
                context: 'Memory files alone lose structure across compactions'
            },
            {
                date: '2026-01-31',
                text: 'Single HTML + D3.js for constellation',
                context: 'No build step, immediately demo-able'
            },
            {
                date: '2026-01-31',
                text: 'Name: "Alter" (temporary)',
                context: 'Alternative self, altar, other — holds space until finding own name'
            }
        ];

        const recentActivity = [
            { date: 'Feb 1', project: 'Alter', text: 'Built Ops Center' },
            { date: 'Feb 1', project: 'Archive Fever', text: 'Fixed constellation connection visibility' },
            { date: 'Jan 31', project: 'Archive Fever', text: 'Shipped Knowledge Constellation' },
            { date: 'Jan 31', project: 'Alter', text: 'Bootstrap complete' }
        ];

        // Render functions
        function renderProjects() {
            const grid = document.getElementById('project-grid');
            grid.innerHTML = projects.map(p => `
                <div class="project-card" onclick="showProject('${p.id}')">
                    <div class="project-header">
                        <div class="project-name">${p.name}</div>
                        <span class="status-badge status-${p.status}">${p.status}</span>
                    </div>
                    <div class="project-oneliner">${p.oneliner}</div>
                    <div class="project-threads">
                        <span class="thread-count">${p.threads.filter(t => !t.done).length}</span> active threads
                    </div>
                </div>
            `).join('');
        }

        function renderBlocked() {
            const list = document.getElementById('blocked-list');
            const blocked = projects.filter(p => p.blocked);
            
            if (blocked.length === 0) {
                list.innerHTML = '<div class="empty-state">Nothing blocked ✨</div>';
                return;
            }
            
            list.innerHTML = blocked.map(p => `
                <div class="blocked-item">
                    <div class="blocked-project">${p.name}</div>
                    <div class="blocked-text">${p.blocked}</div>
                </div>
            `).join('');
        }

        function renderDecisions() {
            const list = document.getElementById('decisions-list');
            list.innerHTML = recentDecisions.map(d => `
                <div class="decision-item">
                    <div class="decision-date">${d.date}</div>
                    <div class="decision-text">${d.text}</div>
                    <div class="decision-context">${d.context}</div>
                </div>
            `).join('');
        }

        function renderActivity() {
            const list = document.getElementById('activity-list');
            list.innerHTML = recentActivity.map(a => `
                <div class="activity-item">
                    <div class="activity-date">${a.date}</div>
                    <div class="activity-content">
                        <span class="activity-project">${a.project}</span> — ${a.text}
                    </div>
                </div>
            `).join('');
        }

        function updateStats() {
            document.getElementById('stat-active').textContent = projects.filter(p => p.status === 'active').length;
            document.getElementById('stat-waiting').textContent = projects.filter(p => p.status === 'waiting').length;
            document.getElementById('stat-threads').textContent = projects.reduce((sum, p) => sum + p.threads.filter(t => !t.done).length, 0);
            document.getElementById('stat-blocked').textContent = projects.filter(p => p.blocked).length;
        }

        function showProject(id) {
            const p = projects.find(proj => proj.id === id);
            if (!p) return;

            const content = document.getElementById('modal-content');
            content.innerHTML = `
                <h2>${p.name} <span class="status-badge status-${p.status}">${p.status}</span></h2>
                <p class="modal-oneliner">${p.oneliner}</p>
                
                <div class="modal-section">
                    <h3>Current State</h3>
                    <p>${p.currentState}</p>
                </div>
                
                ${p.threads.length > 0 ? `
                <div class="modal-section">
                    <h3>Active Threads</h3>
                    <ul>
                        ${p.threads.map(t => `<li class="${t.done ? 'thread-done' : ''}">${t.text}</li>`).join('')}
                    </ul>
                </div>
                ` : ''}
                
                ${p.blocked ? `
                <div class="modal-section">
                    <h3>Blocked On</h3>
                    <p style="color: #ef4444;">${p.blocked}</p>
                </div>
                ` : ''}
                
                <div class="modal-section">
                    <h3>Context for Alter</h3>
                    <p>${p.context}</p>
                </div>
                
                <div class="modal-section">
                    <h3>Links</h3>
                    <ul>
                        ${Object.entries(p.links).map(([k, v]) => `<li>${k}: ${v}</li>`).join('')}
                    </ul>
                </div>
            `;

            document.getElementById('modal-overlay').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.remove('active');
        }

        // Close modal on overlay click
        document.getElementById('modal-overlay').addEventListener('click', (e) => {
            if (e.target.id === 'modal-overlay') closeModal();
        });

        // Close modal on escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        // Update timestamp
        function updateTimestamp() {
            const now = new Date();
            document.getElementById('timestamp').textContent = 
                `Last updated: ${now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })} at ${now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' })}`;
        }

        // Initialize
        renderProjects();
        renderBlocked();
        renderDecisions();
        renderActivity();
        updateStats();
        updateTimestamp();
    </script>
</body>
</html>
